<div class="loader" *ngIf="loading">
    <div class="spinner"></div>
    <br />
    <p>Cargando datos de la empresa...</p>
</div>


<div class="card bg-white rounded-xl shadow-lg p-6 max-w-4xl mx-auto" *ngIf="!loading">
    <div class="flex justify-between items-center mb-8 pb-4 border-b border-gray-200">
        <h2 class="text-2xl font-bold text-gray-800">Datos de la Empresa</h2>
        <div class="w-12 h-12 bg-blue-100 rounded-full flex items-center justify-center">
            <i class="pi pi-building text-blue-600 text-xl"></i>
        </div>
    </div>

    <div class="space-y-6">
        <!-- Company Name -->
        <div class="bg-gray-50 rounded-lg p-6 transition-all duration-300 hover:shadow-md">
            <label for="nombre_empresa" class="block text-sm font-semibold text-gray-700 mb-2">
                Nombre de la Empresa <span class="text-red-500">*</span>
            </label>
            <input pInputText id="nombre_empresa" [(ngModel)]="form.nombre_empresa" name="nombre_empresa" required
                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-200" />
        </div>

        <!-- RUC -->
        <div class="bg-gray-50 rounded-lg p-6 transition-all duration-300 hover:shadow-md">
            <label for="ruc" class="block text-sm font-semibold text-gray-700 mb-2">
                RUC <span class="text-red-500">*</span>
            </label>
            <input pInputText id="ruc" [(ngModel)]="form.ruc" name="ruc" required
                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-200" />
        </div>

        <!-- Address -->
        <div class="bg-gray-50 rounded-lg p-6 transition-all duration-300 hover:shadow-md">
            <label for="direccion" class="block text-sm font-semibold text-gray-700 mb-2">
                Dirección <span class="text-red-500">*</span>
            </label>
            <input pInputText id="direccion" [(ngModel)]="form.direccion" name="direccion" required
                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-200" />
        </div>

        <!-- Contact Info Row -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="bg-gray-50 rounded-lg p-6 transition-all duration-300 hover:shadow-md">
                <label for="celular" class="block text-sm font-semibold text-gray-700 mb-2">
                    Celular <span class="text-red-500">*</span>
                </label>
                <input pInputText id="celular" [(ngModel)]="form.celular" name="celular" required
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-200" />
            </div>

            <div class="bg-gray-50 rounded-lg p-6 transition-all duration-300 hover:shadow-md">
                <label for="correo" class="block text-sm font-semibold text-gray-700 mb-2">
                    Correo Electrónico <span class="text-red-500">*</span>
                </label>
                <input pInputText id="correo" [(ngModel)]="form.correo" name="correo" type="email" required
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-200" />
            </div>
        </div>

        <!-- Branches -->
        <div class="bg-gray-50 rounded-lg p-6 transition-all duration-300 hover:shadow-md">
            <label for="sedes" class="block text-sm font-semibold text-gray-700 mb-2">
                Número de Sedes
            </label>
            <p-inputNumber [(ngModel)]="form.sedes" name="sedes" mode="decimal" [showButtons]="true" [min]="0"
                [max]="100" class="w-full">
            </p-inputNumber>
        </div>

        <!-- Logo Upload -->
        <div
            class="bg-gradient-to-br from-blue-50 to-indigo-50 rounded-xl p-6 border-2 border-dashed border-blue-200 transition-all duration-300 hover:border-blue-400">
            <label class="block text-sm font-semibold text-gray-700 mb-4">
                Logo de la Empresa
            </label>
            <div class="flex flex-col md:flex-row items-center gap-6">
                <div class="flex-shrink-0">
                    <img *ngIf="hasCustomLogo" [src]="form.imagen" alt="Logo Personalizado"
                        class="w-24 h-24 md:w-32 md:h-32 object-cover rounded-xl shadow-lg border-4 border-white" />
                    <img *ngIf="!hasCustomLogo && form.imagen" [src]="form.imagen" alt="Logo Predeterminado"
                        class="w-24 h-24 md:w-32 md:h-32 object-contain rounded-xl shadow-lg border-4 border-white bg-white p-2" />
                    <div *ngIf="!form.imagen"
                        class="w-24 h-24 md:w-32 md:h-32 bg-gray-200 rounded-xl flex items-center justify-center border-2 border-dashed border-gray-300">
                        <i class="pi pi-image text-gray-400 text-2xl"></i>
                    </div>
                </div>
                <div class="flex flex-col items-center md:items-start">
                    <input type="file" (change)="onFileSelected($event)" accept="image/*" class="hidden" #fileInput />
                    <div class="flex flex-col sm:flex-row gap-3">
                        <p-button label="Seleccionar Imagen" icon="pi pi-upload" (click)="fileInput.click()"
                            styleClass="p-button-raised p-button-info">
                        </p-button>
                        <p-button *ngIf="hasCustomLogo" label="Eliminar Logo" icon="pi pi-trash" (click)="clearLogo()"
                            styleClass="p-button-raised p-button-danger" severity="danger">
                        </p-button>
                    </div>
                    <p class="text-sm text-gray-500 mt-3 text-center md:text-left">
                        <i class="pi pi-info-circle mr-2"></i>
                        Formatos permitidos: JPG, PNG, GIF, WEBP (Máximo 5MB)
                    </p>
                </div>
            </div>
        </div>

        <!-- Save Button -->
        <div class="pt-6 border-t border-gray-200">
            <div class="flex justify-end">
                <p-button label="Guardar Cambios" icon="pi pi-check" (click)="save()" [loading]="saving"
                    styleClass="p-button-raised p-button-success px-6 py-3 text-lg">
                </p-button>
            </div>
        </div>
    </div>
</div>
