<p-toast />

<div class="card" style="width: 340% !important;">
  <p-button icon="pi pi-arrow-left" [rounded]="true" [outlined]="true" severity="secondary" (onClick)="goBack()"
    class="mr-4" pTooltip="Volver a Configuración" />

  <div class="flex justify-content-between align-items-center mb-4 mt-6">
    <h2 class="text-900 font-bold text-2xl">Gestión de Permisos por Perfil</h2>
  </div>

  <!-- Selector de Perfil -->
  <div class="perfil-selector-card">
    <div class="perfil-selector-header">
      <i class="pi pi-shield"></i>
      <span>Seleccionar Perfil</span>
    </div>
    <div class="perfil-selector-body">
      <p-dropdown [(ngModel)]="selectedPerfil" [options]="perfiles" optionLabel="nombre" optionValue="idperfil"
        placeholder="Seleccione un perfil" (onChange)="onPerfilChange()" [style]="{ width: '100%' }" appendTo="body">
      </p-dropdown>
    </div>
  </div>

  <!-- Tabla de Permisos -->
  <div class="card mt-4" *ngIf="selectedPerfil && menus.length > 0">
    <div class="flex justify-content-between align-items-center mb-4">
      <h3 class="text-900 font-bold text-xl m-0">
        <i class="pi pi-lock" style="margin-right: 0.5rem; color: #64748b;"></i>
        Permisos de Menú
      </h3>
      <span class="menu-count-badge">{{ menus.length }} menús</span>
    </div>

    <div class="overflow-auto">
      <p-table [value]="menus" styleClass="p-datatable-striped p-datatable-sm" [paginator]="true" [rows]="10"
        [showCurrentPageReport]="true" currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} menús"
        [rowHover]="true">
        <ng-template pTemplate="header">
          <tr>
            <th class="font-medium">Menú</th>
            <th class="text-center font-medium permiso-col">
              <i class="pi pi-eye permiso-icon ver"></i> Ver
            </th>
            <th class="text-center font-medium permiso-col">
              <i class="pi pi-pencil permiso-icon editar"></i> Editar
            </th>
            <th class="text-center font-medium permiso-col">
              <i class="pi pi-trash permiso-icon eliminar"></i> Eliminar
            </th>
          </tr>
        </ng-template>
        <ng-template pTemplate="body" let-m>
          <tr>
            <td>
              <span class="font-semibold">{{m.nombre}}</span>
            </td>
            <td class="text-center">
              <p-checkbox [(ngModel)]="m.permisos.puede_ver" binary="true"
                (onChange)="togglePermiso(m, 'puede_ver', $event.checked)" [trueValue]="true" [falseValue]="false"
                [binary]="true">
                <ng-template pTemplate="icon">
                  <i class="pi pi-check"></i>
                </ng-template>
              </p-checkbox>
            </td>
            <td class="text-center">
              <p-checkbox [(ngModel)]="m.permisos.puede_editar" binary="true"
                (onChange)="togglePermiso(m, 'puede_editar', $event.checked)" [trueValue]="true" [falseValue]="false"
                [binary]="true">
                <ng-template pTemplate="icon">
                  <i class="pi pi-check"></i>
                </ng-template>
              </p-checkbox>
            </td>
            <td class="text-center">
              <p-checkbox [(ngModel)]="m.permisos.puede_eliminar" binary="true"
                (onChange)="togglePermiso(m, 'puede_eliminar', $event.checked)" [trueValue]="true" [falseValue]="false"
                [binary]="true">
                <ng-template pTemplate="icon">
                  <i class="pi pi-check"></i>
                </ng-template>
              </p-checkbox>
            </td>
          </tr>
        </ng-template>
      </p-table>
    </div>
  </div>

  <!-- Empty: Sin menús -->
  <div class="empty-card mt-4" *ngIf="selectedPerfil && menus.length === 0">
    <i class="pi pi-info-circle"></i>
    <h3>No hay menús disponibles</h3>
    <p>No se encontraron menús para asignar permisos.</p>
  </div>

  <!-- Empty: Sin perfil seleccionado -->
  <div class="empty-card mt-4" *ngIf="!selectedPerfil">
    <i class="pi pi-users"></i>
    <h3>Seleccione un perfil</h3>
    <p>Por favor seleccione un perfil para gestionar sus permisos de menú.</p>
  </div>
</div>
