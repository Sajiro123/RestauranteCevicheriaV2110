<div class="card">
    <p-button icon="pi pi-arrow-left" [rounded]="true" [outlined]="true" severity="secondary" (onClick)="goBack()"
        class="mr-4" pTooltip="Volver a Configuración" />

    <div class="flex justify-content-between align-items-center mb-4 mt-6">
        <h2 class="text-900 font-bold text-2xl">Gestión de Menú Perfiles</h2>
    </div>

    <p-toolbar styleClass="mb-4">
        <ng-template #start>
            <p-button label="Nuevo Menú" icon="pi pi-plus" severity="success" (click)="add()" />
        </ng-template>
    </p-toolbar>

    <div class="card">
        <div class="overflow-auto">
            <p-table [value]="menus" [paginator]="true" [rows]="10" responsiveLayout="scroll" [rowHover]="true"
                styleClass="p-datatable-striped p-datatable-sm">
                <ng-template #header>
                    <tr>
                        <th>Nombre</th>
                        <th style="width: 160px">Ruta</th>
                        <th style="width: 80px" class="text-center">Sub</th>
                        <th style="width: 80px" class="text-center">Orden</th>
                        <th style="width: 100px" class="text-center">Activo</th>
                        <th style="width: 120px" class="text-center">Acciones</th>
                    </tr>
                </ng-template>
                <ng-template #body let-menu>
                    <tr>
                        <td>
                            <span class="font-semibold">{{ menu.nombre }}</span>
                        </td>
                        <td>
                            <span class="ruta-tag">{{ menu.ruta }}</span>
                        </td>
                        <td class="text-center">
                            <p-tag [value]="menu.es_submenu ? 'Sí' : 'No'"
                                [severity]="menu.es_submenu ? 'info' : 'secondary'" />
                        </td>
                        <td class="text-center">
                            <span class="orden-badge">{{ menu.orden }}</span>
                        </td>
                        <td class="text-center">
                            <p-tag [value]="menu.activo ? 'Activo' : 'Inactivo'"
                                [severity]="menu.activo ? 'success' : 'danger'" />
                        </td>
                        <td class="text-center">
                            <p-button icon="pi pi-pencil" class="mr-2" [rounded]="true" [outlined]="true" size="small"
                                (click)="edit(menu)" pTooltip="Editar" />
                            <p-button icon="pi pi-trash" severity="danger" [rounded]="true" [outlined]="true"
                                size="small" (click)="remove(menu.idmenu)" pTooltip="Eliminar" />
                        </td>
                    </tr>
                </ng-template>

                <ng-template pTemplate="emptymessage">
                    <tr>
                        <td colspan="6" class="text-center py-8">
                            <i class="pi pi-inbox text-600 text-4xl mb-3" style="display:block"></i>
                            <span class="text-600 font-medium">No se encontraron menús.</span>
                        </td>
                    </tr>
                </ng-template>
            </p-table>
        </div>
    </div>
</div>

<!-- Diálogo para agregar/editar menú -->
<p-dialog [(visible)]="showDialog" [style]="{ width: '520px' }" [modal]="true" [draggable]="false" [position]="'center'"
    [resizable]="false" (onHide)="onDialogClose()">
    <ng-template #header>
        <h2 class="m-0 text-xl font-bold">{{ selectedMenu ? 'Editar Menú' : 'Nuevo Menú' }}</h2>
    </ng-template>

    <ng-template #content>
        <app-menu-form [data]="selectedMenu" (onSave)="onDialogSave()" (onClose)="onDialogClose()">
        </app-menu-form>
    </ng-template>
</p-dialog>
