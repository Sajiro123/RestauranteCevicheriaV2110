<p-toast />
<p-confirmDialog [style]="{ width: '450px' }" />

<div class="card" style="width: 340% !important;">
    <p-button icon="pi pi-arrow-left" [rounded]="true" [outlined]="true" severity="secondary" (onClick)="goBack()"
        class="mr-4" pTooltip="Volver a Configuración" />

    <div class="flex justify-content-between align-items-center mb-4 mt-6">
        <h2 class="text-900 font-bold text-2xl">Gestión de Toppings</h2>
    </div>

    <p-toolbar styleClass="mb-4">
        <ng-template #start>
            <p-button label="Nuevo Topping" icon="pi pi-plus" severity="success" class="mr-2" (onClick)="openNew()" />
        </ng-template>
        <ng-template #end>
            <span class="p-input-icon-left">
                <i class="pi pi-search"></i>
                <input pInputText type="text" placeholder="Buscar..." (input)="filterToppings($event)" />
            </span>
        </ng-template>
    </p-toolbar>

    <!-- Toppings List Card -->
    <div class="card mt-4" *ngIf="filteredToppings.length > 0">
        <div class="flex justify-content-between align-items-center mb-4">
            <h3 class="text-900 font-bold text-xl">Lista de Toppings</h3>
            <span class="text-500">{{ filteredToppings.length }} toppings registrados</span>
        </div>

        <div class="list-scroll">
            <div class="topping-row" *ngFor="let topping of filteredToppings; let i = index">
                <div class="topping-info">
                    <span class="topping-index">{{ i + 1 }}</span>
                    <span class="topping-name font-medium">{{ topping.nombre }}</span>
                </div>
                <div class="topping-actions">
                    <p-button icon="pi pi-pencil" [rounded]="true" [outlined]="true" class="mr-2"
                        (click)="editTopping(topping)" pTooltip="Editar" />
                    <p-button icon="pi pi-trash" severity="danger" [rounded]="true" [outlined]="true"
                        (click)="deleteTopping(topping)" pTooltip="Eliminar" />
                </div>
            </div>
        </div>
    </div>

    <!-- Empty State -->
    <div class="card mt-4" *ngIf="filteredToppings.length === 0">
        <div class="flex justify-content-center align-items-center py-8">
            <div class="text-center">
                <i class="pi pi-inbox text-600 text-5xl mb-3"></i>
                <h3 class="text-900 font-bold text-xl mb-2">No se encontraron toppings</h3>
                <p class="text-600">Agrega un nuevo topping con el botón superior.</p>
            </div>
        </div>
    </div>
</div>

<!-- Dialog Crear/Editar Topping -->
<p-dialog [(visible)]="toppingDialog" [style]="{ width: '450px' }"
    [header]="isEditing ? 'Editar Topping' : 'Nuevo Topping'" [modal]="true">
    <ng-template #content>
        <div class="flex flex-col gap-6" [formGroup]="toppingForm">
            <div>
                <label for="nombre" class="block font-bold mb-3">Nombre *</label>
                <input type="text" pInputText id="nombre" formControlName="nombre" required autofocus fluid
                    [class.ng-invalid]="toppingForm.get('nombre')?.invalid && submitted" />
                <small class="text-red-500" *ngIf="submitted && toppingForm.get('nombre')?.errors?.['required']">
                    El nombre es requerido.
                </small>
                <small class="text-red-500" *ngIf="submitted && toppingForm.get('nombre')?.errors?.['minlength']">
                    El nombre debe tener al menos 2 caracteres.
                </small>
            </div>
        </div>
    </ng-template>
    <ng-template #footer>
        <p-button label="Cancelar" icon="pi pi-times" text (click)="hideDialog()" />
        <p-button label="Guardar" icon="pi pi-check" (click)="saveTopping()" />
    </ng-template>
</p-dialog>
