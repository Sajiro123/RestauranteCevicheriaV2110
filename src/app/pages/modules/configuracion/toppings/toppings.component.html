<div class="card" style="width: 160% !important;">
    <p-toast />

    <div class="flex items-center mb-4">
        <p-button 
            icon="pi pi-arrow-left" 
            [rounded]="true" 
            [outlined]="true" 
            severity="secondary"
            (onClick)="goBack()"
            class="mr-4"
            pTooltip="Volver a Configuración" />
        <h2 class="text-2xl font-semibold text-surface-900 dark:text-surface-0 m-0">
            Gestión de Toppings
        </h2>
    </div>

    <p-toolbar styleClass="mb-6">
        <ng-template #start>
            <p-button label="Nuevo Topping" icon="pi pi-plus" severity="secondary" class="mr-2" (onClick)="openNew()" />
        </ng-template>
    </p-toolbar>

    <p-table
        #dt
        [value]="toppings"
        [rows]="10"
        [paginator]="true"
        [globalFilterFields]="['nombre']"
        [tableStyle]="{ 'min-width': '50rem' }"
        [(selection)]="selectedToppings"
        [rowHover]="true"
        dataKey="idtopings"
        currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} toppings"
        [showCurrentPageReport]="true"
        [rowsPerPageOptions]="[10, 20, 30]"
    >
        <ng-template #caption>
            <div class="flex items-center justify-between">
                <h5 class="m-0">Gestionar Toppings</h5>
                <p-iconfield>
                    <p-inputicon styleClass="pi pi-search" />
                    <input pInputText type="text" (input)="onGlobalFilter(dt, $event)" placeholder="Buscar..." />
                </p-iconfield>
            </div>
        </ng-template>

        <ng-template #header>
            <tr>
                <th pSortableColumn="idtopings" style="min-width:8rem">
                    ID
                    <p-sortIcon field="idtopings" />
                </th>
                <th pSortableColumn="nombre" style="min-width:20rem">
                    Nombre
                    <p-sortIcon field="nombre" />
                </th>
                <th style="min-width:12rem">Acciones</th>
            </tr>
        </ng-template>

        <ng-template #body let-topping>
            <tr>
                <td>{{ topping.idtopings }}</td>
                <td style="min-width:20rem">{{ topping.nombre }}</td>
                <td>
                    <p-button icon="pi pi-pencil" class="mr-2" [rounded]="true" [outlined]="true" (click)="editTopping(topping)" />
                    <p-button icon="pi pi-trash" severity="danger" [rounded]="true" [outlined]="true" (click)="deleteTopping(topping)" />
                </td>
            </tr>
        </ng-template>
    </p-table>

    <p-dialog [(visible)]="toppingDialog" [style]="{ width: '450px' }" [header]="isEditing ? 'Editar Topping' : 'Nuevo Topping'" [modal]="true" [formGroup]="toppingForm">
        <ng-template #content>
            <div class="flex flex-col gap-6">
                <div>
                    <label for="nombre" class="block font-bold mb-3">Nombre *</label>
                    <input type="text" pInputText id="nombre" formControlName="nombre" required autofocus fluid [class.ng-invalid]="toppingForm.get('nombre')?.invalid && submitted" />
                    <small class="text-red-500" *ngIf="submitted && toppingForm.get('nombre')?.errors?.['required']"> El nombre es requerido. </small>
                    <small class="text-red-500" *ngIf="submitted && toppingForm.get('nombre')?.errors?.['minlength']"> El nombre debe tener al menos 2 caracteres. </small>
                </div>
            </div>
        </ng-template>

        <ng-template #footer>
            <p-button label="Cancelar" icon="pi pi-times" text (click)="hideDialog()" />
            <p-button label="Guardar" icon="pi pi-check" (click)="saveTopping()" />
        </ng-template>
    </p-dialog>

    <p-confirmdialog [style]="{ width: '450px' }" />
</div>
